    <meta name="color-scheme" content="light dark" />

    <!-- Theme before first paint: stored choice, else the system's.
         The CSP in vercel.json allows this script by its sha256; a content test checks they match. -->
    <script>
      (() => {
        try {
          const t = localStorage.getItem("theme");
          const dark = t ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          if (dark) document.querySelector('meta[name="theme-color"]').setAttribute("content", "#11131c");
        } catch {}
      })();
    </script>
