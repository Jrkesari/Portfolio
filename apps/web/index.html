<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f1ead8" />
    <meta name="color-scheme" content="light dark" />

    <!-- Theme before first paint: stored choice, else the system's.
         The CSP in vercel.json allows this script by its sha256; a content test checks they match. -->
    <script>
      (() => {
        try {
          const t = localStorage.getItem("theme");
          const dark = t ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          if (dark) document.querySelector('meta[name="theme-color"]').setAttribute("content", "#11131c");
        } catch {}
      })();
    </script>

    <link rel="preload" href="/fonts/newsreader.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/newsreader-display.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/jrk-mono.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Site-wide. Each page's title, description, canonical and structured data come from
         its route (components/Seo.tsx), and the build prerenders them into that page's HTML. -->
    <meta name="author" content="Jayesh Ranjan Kesari" />
    <meta property="og:site_name" content="Jayesh Ranjan Kesari" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:image" content="https://jayesh.cv/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Jayesh Ranjan Kesari, AI engineer: agent loops, tool servers, model routing and token accounting." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@me_jayeshrkesar" />
    <meta name="twitter:creator" content="@me_jayeshrkesar" />
    <meta name="twitter:image" content="https://jayesh.cv/og-image.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="alternate" type="application/rss+xml" href="/feed.xml" title="Notes · Jayesh Ranjan Kesari" />
    <link rel="alternate" type="text/plain" href="/llms.txt" title="llms.txt" />
  </head>
  <body>
    <div id="root"><!--app--></div>
    <noscript>
      <style>
        #root[data-prerendered] * {
          animation-play-state: running;
        }
        #root[data-prerendered] .tick {
          opacity: 1;
        }
      </style>
      <p style="font-family: Georgia, serif; padding: 2rem; max-width: 36rem">
        Without JavaScript the diagrams on this site stand still. The short version is at
        <a href="/llms.txt">/llms.txt</a>, and email is jrkesari@gmail.com.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
